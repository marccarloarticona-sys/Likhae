ServerRoot "C:/xampp/apache"
Listen 8000
ServerName localhost:8000

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

PidFile "C:/Users/mcarl/OneDrive/Documents/Likhae-working/storage/logs/likhae-proxy.pid"
ErrorLog "C:/Users/mcarl/OneDrive/Documents/Likhae-working/storage/logs/likhae-proxy-error.log"
LogLevel warn

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

<Proxy "*">
    Require all granted
</Proxy>

# Browser WebSocket connections and server-side Reverb publishing must
# bypass Laravel's HTTP server. Keep these rules before the catch-all proxy.
ProxyPass "/app/" "ws://127.0.0.1:8080/app/" retry=0 timeout=10
ProxyPassReverse "/app/" "ws://127.0.0.1:8080/app/"
ProxyPass "/apps/" "http://127.0.0.1:8080/apps/" retry=0 timeout=10
ProxyPassReverse "/apps/" "http://127.0.0.1:8080/apps/"

# Cloudflare Tunnel continues to target port 8000; Apache forwards ordinary
# application requests to Laravel's private HTTP listener on port 8001.
ProxyPass "/" "http://127.0.0.1:8001/" retry=0 timeout=60
ProxyPassReverse "/" "http://127.0.0.1:8001/"
