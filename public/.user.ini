; Registration photos and documents, plus Return & Refund evidence uploads,
; require limits above PHP's default 2 MB upload and 8 MB request limits.
; Keep post_max_size larger than upload_max_filesize for multipart form overhead.
post_max_size=512M
upload_max_filesize=200M
max_file_uploads=10
max_input_time=300
max_execution_time=300
